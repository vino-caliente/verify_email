services:
  app:
    build: .
    ports: 
      - "8000:8000"
    env_file: .env
    depends_on:
      database:
        condition: service_healthy # чтобы не только запистилась postgres но и успел выполнится init-скрипт
      mailpit:
        condition: service_started

  database:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./repositories/create_tables.sql:/docker-entrypoint-initdb.d/init.sql:ro # мой sql скрипт скопируется в docker-entrypoint-initdb.d и выполнится при инициализации бд
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" 
      - "8025:8025" # веб-интерфейс

volumes:
  postgres_data:  # том в docker для хранения данных postgres